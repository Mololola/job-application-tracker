name: Classifier Calibration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  classifier-calibration:
    name: Run classifier calibration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run classifier calibration test
        run: npm run test:classifier:strict